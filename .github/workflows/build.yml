name: Build AKSdown APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build file
          echo "ANDROID_HOME=$ANDROID_HOME NDK=$ANDROID_NDK_LATEST_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Fetch and verify yt-dlp
        run: scripts/fetch-engine.sh

      - name: Build QuickJS-NG for Android
        run: scripts/build-quickjs.sh arm64-v8a

      - name: Restore signing key (optional)
        env:
          KS_B64: ${{ secrets.AKS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aks.jks"
            echo "AKS_KEYSTORE=$RUNNER_TEMP/aks.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: building an unsigned release; it is signed afterwards with the AKSdown key."
          fi

      - name: Build release
        env:
          AKS_KEYSTORE_PASSWORD: ${{ secrets.AKS_KEYSTORE_PASSWORD }}
          AKS_KEY_ALIAS: aksdown
          AKS_KEY_PASSWORD: ${{ secrets.AKS_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify contents
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application-label:" | tee apk-verify.txt
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|res/raw/" | tee -a apk-verify.txt
          for f in libpython.so libpython.zip.so libffmpeg.so libffmpeg.zip.so libffprobe.so libqjs.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "MISSING $f"; exit 1; }
          done
          mkdir -p out
          if "$BT/apksigner" verify --verbose --print-certs "$APK" >> apk-verify.txt 2>&1; then
            "$BT/zipalign" -c -P 16 4 "$APK" && echo "zipalign: OK" >> apk-verify.txt
            cp "$APK" out/AKSdown.apk
          else
            echo "UNSIGNED build (add the AKS_KEYSTORE_B64 and AKS_KEYSTORE_PASSWORD secrets)" >> apk-verify.txt
            cp "$APK" out/
          fi
          cp apk-verify.txt out/
          sha256sum out/*.apk | tee -a out/apk-verify.txt

      - name: Publish build as a GitHub release (private to this repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --prerelease \
            --title "AKSdown build ${{ github.run_number }}" --notes "Automated build of ${{ github.sha }}" --target "${{ github.sha }}"

  e2e:
    name: Emulator test with real downloads
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build file ffmpeg python3 zip
      - run: scripts/fetch-engine.sh
      - name: Build QuickJS-NG (x86_64 for the emulator)
        run: scripts/build-quickjs.sh x86_64,arm64-v8a
      - name: Build debug APK with emulator ABI
        run: ./gradlew --no-daemon :app:assembleDebug -Paks.abis=x86_64,arm64-v8a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Host check of automatic quality selection (same yt-dlp build and options)
        continue-on-error: true
        run: python3 -I scripts/quality-check.py app/src/main/res/raw/ytdlp | tee quality-check.txt
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 6000M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e-test.sh app/build/outputs/apk/debug/app-debug.apk e2e-results
      - name: Collect results
        if: always()
        run: mkdir -p e2e-results && cp -f quality-check.txt e2e-results/ 2>/dev/null || true
      - name: Attach test results to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd e2e-results && zip -qr ../e2e-results.zip . && cd ..
          gh release upload "build-${{ github.run_number }}" e2e-results.zip e2e-results/e2e-report.txt --repo "${{ github.repository }}" --clobber || true
